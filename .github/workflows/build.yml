name: build-MiYouHide

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 关键：用老版 Xcode（iOS 17 之前的 SDK），避免 __objc_methlist / __objc_stubs
      # 这些新格式在老 iOS 的 dyld 上不支持
      - name: Select older Xcode
        run: |
          set -e
          for v in 15.2 15.1 15.0.1 15.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              echo "using Xcode $v"
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build dylib
        run: |
          set -eux
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fno-objc-relative-method-lists \
            -O2 \
            -isysroot "$SDK" \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -install_name @executable_path/MiYouHide.dylib \
            -o build/MiYouHide.dylib \
            src/WLHook.m src/WLUI.m \
            -undefined dynamic_lookup
          ls -l build/MiYouHide.dylib
          otool -l build/MiYouHide.dylib | grep -A3 -E "LC_BUILD_VERSION" || true
          otool -l build/MiYouHide.dylib | grep -E "sectname __objc|sectname __init" || true
          codesign -s - -f --timestamp=none build/MiYouHide.dylib || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MiYouHide-dylib
          path: build/MiYouHide.dylib
          if-no-files-found: error
