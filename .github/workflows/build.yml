name: build-MiYouHide

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          for v in 15.4 15.3 15.2 15.1 15.0.1 15.0 14.3.1; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              echo "== using Xcode $v"
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version
          echo "SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
          ls /Applications | grep -i '^Xcode' || true

      - name: Build
        run: |
          set -eux
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          common=(-arch arm64 -miphoneos-version-min=15.0 -fobjc-arc -fno-objc-relative-method-lists -O2 -isysroot "$SDK" -dynamiclib -framework Foundation -framework UIKit -install_name @executable_path/MiYouHide.dylib -undefined dynamic_lookup)
          if xcrun --sdk iphoneos clang "${common[@]}" -Wl,-no_objc_stubs -Wl,-no_fixup_chains -o build/MiYouHide.dylib src/WLHook.m src/WLUI.m; then
            echo "== built with -no_objc_stubs -no_fixup_chains"
          else
            echo "== retry without extra linker flags"
            xcrun --sdk iphoneos clang "${common[@]}" -o build/MiYouHide.dylib src/WLHook.m src/WLUI.m
          fi
          ls -l build/MiYouHide.dylib
          otool -l build/MiYouHide.dylib | grep -E "sectname __objc|sectname __init|LC_BUILD_VERSION" || true
          codesign -s - -f --timestamp=none build/MiYouHide.dylib || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MiYouHide-dylib
          path: build/MiYouHide.dylib
          if-no-files-found: error
